<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finance AI</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main id="appShell" class="app-shell">
      <button id="showChatButton" class="show-chat-button" type="button" hidden>Chat</button>
      <aside class="chat-column" aria-label="Chat">
        <header class="app-header">
          <div>
            <h1>Finance AI</h1>
            <span id="guardrailBadge" class="badge">Idle</span>
          </div>
          <button id="hideChatButton" class="icon-button" type="button" aria-label="Hide chat">Hide</button>
        </header>

        <div id="chatLog" class="chat-log" aria-live="polite">
          <ol id="statusList" class="status-list"></ol>
        </div>

        <details class="trace-panel">
          <summary>Run details</summary>
          <div id="traceOutput" class="trace-output" aria-live="polite"></div>
        </details>

        <form id="chatForm" class="chat-form">
          <textarea id="queryInput" name="query" rows="4" autocomplete="off" placeholder="Ask about your portfolio">Review my portfolio</textarea>
          <div class="chat-controls">
            <button id="sendButton" type="submit">Send</button>
          </div>
        </form>
        <div id="chatResizeHandle" class="chat-resize-handle" role="separator" aria-label="Resize chat" aria-orientation="vertical" tabindex="0"></div>
      </aside>

      <section class="report-column" aria-label="Report">
        <section class="panel report-summary">
          <div class="panel-heading panel-heading-spread">
            <div class="panel-title-stack">
              <h2 id="reportTitle">Portfolio Dashboard</h2>
              <span id="reportMode" class="muted">stored dashboard</span>
            </div>
            <div class="dashboard-controls">
              <span id="portfolioConnectionBadge" class="badge">Not checked</span>
              <button id="portfolioRefreshButton" class="icon-button" type="button">Refresh</button>
            </div>
          </div>
          <p id="portfolioDashboardMeta" class="muted"></p>
          <p id="reportSummary">Loading the latest stored portfolio dashboard.</p>
        </section>

        <section class="panel">
          <div class="panel-heading panel-heading-spread">
            <h2>Holdings & Cash</h2>
            <span id="portfolioMeta" class="muted"></span>
          </div>
          <div id="portfolioPositions" class="position-table"></div>
        </section>

        <section class="panel">
          <div class="panel-heading panel-heading-spread">
            <h2>Allocation</h2>
            <div class="control-row">
              <select id="allocationSort" aria-label="Sort allocation">
                <option value="weight_desc">Largest first</option>
                <option value="weight_asc">Smallest first</option>
                <option value="name_asc">Name A-Z</option>
                <option value="value_desc">Value first</option>
              </select>
              <div class="segmented-control" aria-label="Allocation view">
                <button type="button" data-allocation-view="bars" class="active">Bars</button>
                <button type="button" data-allocation-view="pie">Pie</button>
              </div>
            </div>
          </div>
          <div id="allocationChart" class="allocation-chart"></div>
        </section>

        <section class="panel">
          <h2>Portfolio Evaluation</h2>
          <div id="portfolioEvaluation" class="evaluation-grid"></div>
        </section>

        <section class="grid-panels">
          <section class="panel">
            <h2>Recommendations</h2>
            <ul id="recommendationsList" class="plain-list"></ul>
          </section>
          <section class="panel">
            <h2>Missing Data</h2>
            <ul id="missingDataList" class="plain-list"></ul>
          </section>
        </section>

        <section class="grid-panels">
          <section class="panel">
            <h2>Sentiment</h2>
            <div id="sentimentList" class="holding-list"></div>
          </section>
          <section class="panel">
            <h2>Citations</h2>
            <div id="citationList" class="citation-list"></div>
          </section>
        </section>
      </section>
    </main>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
